services:
  - type: web
    name: claim-processing-pipeline
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn document_processing_pipeline.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_ENV
        value: production
