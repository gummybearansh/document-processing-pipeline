[project]
name = "document-processing-pipeline"
version = "0.1.0"
description = "FastAPI + LangGraph claim processing pipeline"
readme = "README.md"
authors = [
    { name = "gummybearansh", email = "gummybearansh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "google-genai>=1.30.0",
    "langgraph>=0.6.7",
    "pydantic-settings>=2.10.1",
    "pymupdf>=1.26.5",
    "pypdf>=6.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
]

[project.scripts]
document-processing-pipeline = "document_processing_pipeline.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
